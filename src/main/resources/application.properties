# ===== Base de données : H2 =====
# H2 est une base écrite en Java, embarquée dans l'application : aucun serveur à installer, aucun mot de passe.
# jdbc:h2:file:./data/product_db : les données sont enregistrées dans le fichier ./data/product_db.mv.db
#                                   et sont conservées d'un lancement à l'autre.
# AUTO_SERVER=TRUE : permet d'ouvrir la base en même temps depuis H2Console ou IntelliJ.
jdbc.driver=org.h2.Driver
jdbc.url=jdbc:h2:file:./data/product_db;AUTO_SERVER=TRUE
jdbc.username=sa
jdbc.password=
hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== Variante MySQL (énoncé du TP) =====
# Pour utiliser MySQL : commenter les 5 lignes H2 ci-dessus, décommenter celles-ci
# et mettre le vrai mot de passe de l'utilisateur root.
#jdbc.driver=com.mysql.cj.jdbc.Driver
#jdbc.url=jdbc:mysql://localhost:3306/product_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
#jdbc.username=root
#jdbc.password=secret
#hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== Hibernate =====
# show_sql : affiche chaque requête SQL envoyée à la base, utile pour comprendre ce que fait Hibernate
# hbm2ddl  : update = crée ou complète les tables products et categories à partir des entités,
#            sans effacer les données existantes (pratique en développement, à éviter en production)
hibernate.show_sql=true
hibernate.hbm2ddl.auto=update
